<!doctype html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/fonts/fonts.css"><style>
@font-face{font-family:"Montserrat";src:url("assets/brand/Montserrat.ttf");font-weight:100 900}
@font-face{font-family:"JBM";src:url("assets/brand/JetBrainsMono.ttf");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0D3732;font-family:Montserrat;color:#EFE7DF;position:relative}
.hdr{position:absolute;left:80px;top:300px;display:flex;align-items:center;gap:22px}
.hdr .c{height:78px}.hdr .w{display:flex;flex-direction:column;align-items:flex-end}.hdr .w img{height:30px}
.hdr .w small{font:700 14.5px/1 Montserrat;letter-spacing:.2em;color:#EFE7DF;margin-top:9px;margin-right:-.2em}
.hl{position:absolute;left:74px;font-weight:800;letter-spacing:-.045em;line-height:.95}
.it{position:absolute;font-family:"Playfair Display",serif;font-style:italic;font-weight:600;color:#C99A6A;line-height:1}
.win{position:absolute;background:#fff;border:3px solid #190F09}
.win .bar{height:48px;border-bottom:3px solid #190F09;position:relative;background:repeating-linear-gradient(180deg,#190F09 0 3px,#fff 3px 9px);background-clip:content-box;padding:8px 56px}
.win .bar .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:0 16px;font:600 24px/1 JBM;color:#190F09;white-space:nowrap}
.win .bar .b{position:absolute;left:12px;top:10px;width:24px;height:24px;border:3px solid #190F09;background:#fff}
.win img{display:block;width:100%}
.cut{position:absolute}.cut img{display:block;width:100%}
#grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="hdr"><img class="c" src="assets/brand/crest_light.svg"><span class="w"><img src="assets/brand/letters_light.svg"><small>AI академія</small></span></div>
<div class="hl" style="top:450px;font-size:124px">Будь-яка</div>
<div class="hl" style="top:570px;font-size:124px">тема</div>
<div class="it" style="left:76px;top:690px;font-size:150px">за вечір</div>
<svg style="position:absolute;left:40px;top:855px" width="620" height="60"><path d="M10,30 Q80,10 150,32 T300,30 T450,28 T600,26" fill="none" stroke="#EFE7DF" stroke-width="7" stroke-linecap="round"/></svg>
<div class="cut" style="left:530px;top:900px;width:470px;transform:rotate(2deg)"><img src="assets/stickers/cover_collage.png"></div>
<div class="win" style="left:60px;top:1060px;width:410px;transform:rotate(-4deg)"><div class="bar"><i class="b"></i><span class="t">mind_map</span></div><img src="assets/stills/mind.jpg"><img src="assets/stickers/tape_13.png" style="position:absolute;top:-14px;left:50%;width:78px;transform:translateX(-50%) rotate(-5deg)"></div>
<div style="position:absolute;left:70px;top:1440px;width:400px;transform:rotate(-3deg)"><img src="assets/gemini_notebook_logo.png" style="display:block;width:100%"></div>
<div id="grain"></div>
</body></html>
