<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>
@font-face{font-family:"Montserrat";src:url("assets/brand/Montserrat.ttf");font-weight:100 900}
@font-face{font-family:"JBM";src:url("assets/brand/JetBrainsMono.ttf");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0D3732;font-family:Montserrat;color:#EFE7DF;position:relative}
.hdr{position:absolute;left:80px;top:300px;display:flex;align-items:center;gap:22px}
.hdr .c{height:78px}.hdr .w{display:flex;flex-direction:column;align-items:flex-end}.hdr .w img{height:30px}
.hdr .w small{font:700 14.5px/1 Montserrat;letter-spacing:.2em;color:#EFE7DF;margin-top:9px;margin-right:-.2em}
.mono{position:absolute;left:80px;font:500 36px/1 JBM;color:#C99A6A}
.hl{position:absolute;left:72px;font-weight:800;letter-spacing:-.045em;line-height:.95}
.a{color:#C99A6A}
.stk{position:absolute;background:#fff;padding:12px}.stk img{display:block;width:100%}
.tape{position:absolute;top:-22px;left:50%;width:170px;height:46px;margin-left:-85px;background:rgba(239,231,223,.78);transform:rotate(-4deg)}
.glyph{position:absolute;font-weight:800;color:#A67445;line-height:1}
#grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="hdr"><img class="c" src="assets/brand/crest_light.svg"><span class="w"><img src="assets/brand/letters_light.svg"><small>AI академія</small></span></div>
<div class="glyph" style="left:860px;top:330px;font-size:300px">#</div>
<div class="mono" style="top:470px">// Gemini Notebook</div>
<div class="hl" style="top:530px;font-size:150px">Будь-яка</div>
<div class="hl" style="top:675px;font-size:150px">тема</div>
<div class="hl a" style="top:820px;font-size:150px">за вечір</div>
<div class="stk" style="left:110px;top:1040px;width:560px;transform:rotate(-3deg)"><img src="assets/clips/mind/020.jpg"><div class="tape"></div></div>
<div class="stk" style="left:560px;top:1220px;width:440px;transform:rotate(4deg)"><img src="assets/clips/audio/020.jpg"><div class="tape" style="transform:rotate(5deg)"></div></div>
<div style="position:absolute;left:90px;top:1460px;width:520px;transform:rotate(-2deg)"><img src="assets/gemini_notebook_logo.png" style="display:block;width:100%"></div>
<div id="grain"></div>
</body></html>
