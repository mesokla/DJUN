<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.tag{display:inline-flex;flex-direction:column;align-items:flex-start;background:rgba(10,10,16,.80);border:2px solid rgba(177,140,255,.8);color:#fff;border-radius:18px;font-weight:600;letter-spacing:-.8px;box-shadow:0 8px 30px rgba(0,0,0,.4)}

#ya{position:absolute;left:0;top:0;width:96px;height:96px;padding:8px}

#man{position:absolute;left:0;top:0;width:1280px;height:720px}
#man .tag{position:absolute;left:880px;top:34px;font-size:36px;padding:12px 22px;line-height:1.12}

<div id="ya"><div class="tag">Я</div></div>
<div id="man"><div class="tag">Мій акаунт<b>на Kraken</b></div>
 <svg width="1280" height="720" style="position:absolute;left:0;top:0"><path d="M875 100 C 860 105, 850 110, 842 118"/><path d="M842 100 L841 119 L860 120"/></svg></div>

</body></html>
