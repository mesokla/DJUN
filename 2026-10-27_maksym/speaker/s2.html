<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat.ttf)}@font-face{font-family:J;src:url(JetBrainsMono.ttf)}

.top .r{margin-left:auto;font:500 24px/1 J;color:#190F09;opacity:.7}
.frame{position:absolute;left:64px;top:200px;width:952px;height:714px;border-radius:22px;background:#190F09}
.k{position:absolute;left:64px;top:968px;font:500 24px/1 J;color:#A16E3B}
h1{position:absolute;left:64px;top:990px;font-weight:800;font-size:76px;line-height:1;letter-spacing:-.03em;color:#190F09}

.sub{position:absolute;left:64px;bottom:96px;font:500 30px/1.3 M;color:#6E5F52}
