<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat.ttf)}@font-face{font-family:J;src:url(JetBrainsMono.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:M;background:#190F09}
.bg{position:absolute;inset:0;background:radial-gradient(65% 50% at 75% 65%,#FFFFFF 0%,#F4EEE7 40%,#EFE7DF 75%,#E6DACD 100%)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(25,15,9,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(25,15,9,.06) 1px,transparent 1px);background-size:90px 90px;-webkit-mask:linear-gradient(to bottom,transparent 10%,#000 45%,#000 80%,transparent)}.ring{position:absolute;left:500px;top:500px;width:600px;height:600px;border-radius:50%;border:3px solid rgba(161,110,59,.55)}.ring2{position:absolute;left:560px;top:560px;width:480px;height:480px;border-radius:50%;border:2px dashed rgba(161,110,59,.35)}

.code{position:absolute;inset:0;font:500 26px/1.6 J;color:rgba(239,231,223,.07);white-space:pre;padding:150px 40px;overflow:hidden}
.top{position:absolute;top:64px;left:64px;right:64px;display:flex;align-items:center;gap:16px}
.top .w{display:flex;flex-direction:column;align-items:flex-end}.top small{font:700 13px/1 M;letter-spacing:.2em;color:#A16E3B;margin-top:6px;margin-right:-.2em}
.top .r{margin-left:auto;font:500 24px/1 J;color:#190F09;opacity:.7}
h1{position:absolute;left:64px;top:210px;font-weight:800;font-size:112px;line-height:.95;letter-spacing:-.035em;color:#190F09}
.sub{position:absolute;left:66px;top:445px;font-weight:700;font-size:44px;line-height:1.12;color:#190F09}
.sub em{font-style:normal;color:#A16E3B}
.person{position:absolute;right:-30px;bottom:0;height:780px}
.pill{position:absolute;left:64px;top:610px;padding:20px 26px;border-radius:18px;border:2px solid #A16E3B;font:800 28px/1.2 M;color:#190F09}
.pill span{display:block;font:500 22px/1.3 J;color:#714326;margin-top:6px}
.name{position:absolute;left:0;bottom:110px;width:560px;padding:40px 40px 40px 64px;background:#190F09}
.name b{display:block;font-weight:800;font-size:70px;line-height:.98;letter-spacing:-.02em;color:#fff}
.name p{font:500 27px/1.3 M;color:#EFE7DF;margin-top:20px}
.name i{display:block;font:500 22px/1 J;font-style:normal;color:#C9935E;margin-top:18px}
</style>
<div class="bg"></div><div class="grid"></div><div class="ring"></div><div class="ring2"></div>
<div class="top"><img src="crest.svg" style="height:64px"><div class="w"><img src="letters.svg" style="height:26px"><small>AI академія</small></div><div class="r">// інтенсив</div></div>
<h1>AI: Від чату<br>до процесу</h1>
<div class="sub">Перший робочий процес<br><em>за 7 днів</em></div>
<img class="person" src="cutout.png">
<div class="pill">3 зустрічі наживо<span>+ 4 уроки в записі</span></div>
<div class="name"><b>МАКСИМ<br>КОВАЛЕНКО</b><p>Lead Researcher<br>MergeWave Capital & DARC</p></div>
