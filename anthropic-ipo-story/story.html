<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0A0A10;color:#fff}
#s::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:180px 180px}
.g1{position:absolute;right:-300px;top:-220px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(112,64,230,.5),transparent 65%)}
.g2{position:absolute;left:-340px;bottom:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(112,64,230,.38),transparent 65%)}
.logo{position:absolute;left:96px;top:250px;width:270px}
.chip{position:absolute;left:96px;top:420px;display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border:1.5px solid rgba(177,140,255,.6);border-radius:999px;background:rgba(124,82,255,.14);font-size:30px;font-weight:500;color:#D9CCFF}
.chip i{width:12px;height:12px;border-radius:50%;background:#B18CFF;box-shadow:0 0 12px #B18CFF}
h1{position:absolute;left:96px;right:80px;top:520px;font-weight:500;font-size:96px;line-height:1.04;letter-spacing:-4px}
h1 span{color:#B18CFF}
.date{position:absolute;left:96px;top:860px;display:flex;align-items:baseline;gap:22px}
.date b{font-size:190px;font-weight:600;letter-spacing:-8px;line-height:1;color:#fff}
.date em{font-style:normal;font-size:44px;font-weight:500;color:#c4c2d0;line-height:1.15}
.hl{position:absolute;left:96px;right:96px;top:1150px;display:flex;align-items:center;gap:36px;padding:34px 40px;border:1.5px solid rgba(255,255,255,.12);border-radius:36px;background:rgba(20,19,30,.82)}
.ring{flex:none;width:170px;height:170px;border-radius:50%;padding:7px;background:conic-gradient(#B18CFF,#7040E6,#C9B3FF,#B18CFF)}
.ring div{width:100%;height:100%;border-radius:50%;background:#14131E;border:6px solid #0A0A10;display:grid;place-items:center;font-size:40px;font-weight:600;letter-spacing:-1px;color:#fff}
.hl p{font-size:38px;font-weight:500;line-height:1.25;letter-spacing:-.8px}
.hl p small{display:block;margin-top:10px;font-size:29px;font-weight:400;color:#a9a6b8;letter-spacing:-.2px;line-height:1.3}
</style></head><body><div id="s"><div class="g1"></div><div class="g2"></div>
<img class="logo" src="logo.svg">
<div class="chip"><i></i>Anthropic IPO</div>
<h1>Усе про IPO Anthropic —<br><span>у наших вибраних</span></h1>
<div class="date"><b>19</b><em>листопада<br>дата IPO</em></div>
<div class="hl"><div class="ring"><div>IPO</div></div><p>Шукай вибрані «Anthropic IPO» у профілі<small>Деталі й відповіді на питання зібрали в одному місці</small></p></div>
</div></body></html>
