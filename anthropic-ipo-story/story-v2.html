<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#s{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff;
 background:radial-gradient(900px 700px at 78% 62%,rgba(110,60,230,.42),transparent 70%),radial-gradient(700px 600px at 10% 105%,rgba(90,50,200,.25),transparent 70%),linear-gradient(180deg,#0d0b15,#0a0910 60%,#0b0912)}
.chip{position:absolute;left:72px;top:250px;padding:14px 30px;border:1.5px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.06);font-size:30px;font-weight:500}
.eb{position:absolute;left:72px;top:385px;font-size:36px;color:#c9c6d6}
h1{position:absolute;left:72px;right:72px;top:440px;font-weight:400;font-size:118px;line-height:1.06;letter-spacing:-4px}
h1 span{color:#B7A3FF}
.ring{position:absolute;left:50%;top:960px;transform:translateX(-50%);width:330px;height:330px;border-radius:50%;padding:9px;background:conic-gradient(from 200deg,#C9B6FF,#7B4DFF,#3b2a7a,#C9B6FF);box-shadow:0 0 120px rgba(124,82,255,.45)}
.ring div{width:100%;height:100%;border-radius:50%;background:#100e18;border:10px solid #0b0a11;display:grid;place-items:center;font-size:58px;font-weight:500;letter-spacing:-1.5px}
.cap{position:absolute;left:0;right:0;top:1320px;text-align:center;font-size:36px;font-weight:500;color:#fff}
.cap small{display:block;margin-top:12px;font-size:30px;font-weight:400;color:#a9a5b9}
.disc{position:absolute;left:72px;right:200px;top:1640px;font-size:21px;line-height:1.4;color:#77738a}
.logo{position:absolute;left:72px;top:1730px;width:230px}
</style></head><body><div id="s">
<div class="chip">Anthropic IPO</div>
<div class="eb">Пропустили сторіс?</div>
<h1>Усе про IPO<br>Anthropic<br><span>у вибраних</span></h1>
<div class="ring"><div>IPO</div></div>
<div class="cap">Вибрані «Anthropic IPO» у профілі<small>Заявки до 18 листопада · лістинг ≈19 листопада</small></div>
<div class="disc">Розподіл не гарантований. Недоступно в США, Великій Британії, Канаді, Японії, Австралії, Новій Зеландії. Не є інвестиційною порадою.</div>
<img class="logo" src="logo.svg">
</div></body></html>
