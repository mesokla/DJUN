<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat.ttf)}@font-face{font-family:J;src:url(JetBrainsMono.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:M}
.sc{position:absolute;inset:0;overflow:hidden}
#before{background:#140E08;color:#EFE7DF}#after{background:#EFE7DF;color:#190F09}#end{background:#140E08;color:#EFE7DF}
.logo{position:absolute;top:250px;left:80px;display:flex;align-items:center;gap:14px}
.logo .w{display:flex;flex-direction:column;align-items:flex-end}.logo small{font:700 13px/1 M;letter-spacing:.2em;margin-top:7px;margin-right:-.2em;color:#C9935E}
.tag{position:absolute;left:80px;top:380px;font:600 30px/1 J;letter-spacing:.06em}
.clock{position:absolute;left:76px;top:420px;font-weight:800;font-size:230px;letter-spacing:-.05em;line-height:1}
.cap{position:absolute;left:80px;top:660px;font:600 50px/1.1 M;letter-spacing:-.02em}
.win{position:absolute;width:760px;background:#fff;color:#190F09;border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.55);overflow:hidden}
.win .bar{display:flex;gap:10px;align-items:center;padding:14px 20px;background:#F1ECE6;font:500 22px/1 J;color:#8a8278}
.win .bar i{width:12px;height:12px;border-radius:50%;background:#d6cfc6;display:block}
.win .bd{padding:26px 30px;font:600 38px/1.25 M}
.win .bd small{display:block;font:500 26px/1.3 M;color:#8a7f73;margin-top:8px}
.ok{position:absolute;left:80px;right:80px;background:#fff;border-radius:24px;padding:28px 32px;display:flex;gap:24px;align-items:center;box-shadow:0 18px 40px rgba(25,15,9,.12)}
.ok .c{width:66px;height:66px;border-radius:50%;background:#190F09;color:#EFE7DF;display:flex;align-items:center;justify-content:center;font:800 36px/1 M;flex:none}
.ok b{display:block;font-weight:800;font-size:38px;letter-spacing:-.02em}.ok span{display:block;font:500 26px/1.2 J;color:#8a7f73;margin-top:8px}
.big{position:absolute;left:80px;right:80px;font-weight:800;letter-spacing:-.05em;line-height:.92}
.flash{position:absolute;inset:0;background:#EFE7DF;pointer-events:none}
</style>
<div class="sc" id="before">
 <div class="logo"><img src="crest_light.svg" style="height:60px"><div class="w"><img src="letters_light.svg" style="height:25px"><small>AI академія</small></div></div>
 <div class="tag" style="color:#C9935E">// ваш ранок зараз</div>
 <div class="clock" id="c1">09:00</div>
 <div class="cap" id="cap1">і досі не почали<br>свою роботу</div>
 <div id="wins"></div>
</div>
<div class="sc" id="after">
 <div class="logo"><img src="crest.svg" style="height:60px"><div class="w"><img src="letters.svg" style="height:25px"><small style="color:#A16E3B">AI академія</small></div></div>
 <div class="tag" style="color:#A16E3B">// з AI-асистентом</div>
 <div class="clock" id="c2">09:00</div>
 <div class="cap" id="cap2">і все вже зроблено</div>
 <div id="oks"></div>
</div>
<div class="sc" id="end">
 <img src="glyph_O.png" id="g" style="position:absolute;right:-160px;top:980px;height:640px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))">
 <div class="logo"><img src="crest_light.svg" style="height:60px"><div class="w"><img src="letters_light.svg" style="height:25px"><small>AI академія</small></div></div>
 <div class="tag" style="color:#C9935E" id="e0">// як так зробити</div>
 <div class="big" id="e1" style="top:440px;font-size:190px">Найми<br><span style="background:linear-gradient(180deg,#F2D29A,#C99662 55%,#8E5F33);-webkit-background-clip:text;color:transparent">AI</span></div>
 <div id="e2" style="position:absolute;left:80px;right:300px;top:860px;font:500 44px/1.35 M;color:#E4D8CB">Інтенсив, де за 7 днів ви налаштуєте свого асистента</div>
 <div id="e3" style="position:absolute;left:80px;top:1130px;display:flex;gap:16px">
  <span style="font:600 30px/1 J;padding:16px 22px;border:2px solid rgba(201,147,94,.7);border-radius:999px">старт 9.11</span>
  <span style="font:600 30px/1 J;padding:16px 22px;border:2px solid rgba(201,147,94,.7);border-radius:999px">1 490 ₴ до 8.11</span></div>
 <div id="e4" style="position:absolute;left:80px;top:1300px;font:600 40px/1 J;color:#C9935E">najmy-ai.djun.com.ua</div>
</div>
<div class="flash" id="fl"></div>
<script>
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const W=[["пошта","Нові заявки (12)","перенести в таблицю"],["excel","звіт_фінал_2.xlsx","а є ще звіт_фінал_ОСТАННІЙ"],["месенджер","«А скільки коштує?»","вже вчетверте за ранок"],["буфер","Ctrl+C → Ctrl+V","і так 40 разів"],["пошта","«Можеш скинути той файл ще раз?»",""],["календар","Звіт до 12:00!","нагадування"]];
const pos=[[80,880,-4],[240,1010,3],[60,1150,-2],[260,1280,4],[100,1420,-3],[220,1560,2]];
const wins=document.getElementById('wins');
W.forEach((w,i)=>{const d=document.createElement('div');d.className='win';d.id='w'+i;d.innerHTML=`<div class="bar"><i></i><i></i><i></i>&nbsp;${w[0]}</div><div class="bd">${w[1]}${w[2]?`<small>${w[2]}</small>`:''}</div>`;wins.appendChild(d);});
const O=[["3 заявки в таблиці","09:00 · AI-асистент"],["Звіт за тиждень надіслано","09:00 · у Telegram"],["Відповіли 5 клієнтам","09:01 · типові питання"],["Новини галузі зібрано","09:01 · коротко"]];
const oks=document.getElementById('oks');
O.forEach((o,i)=>{const d=document.createElement('div');d.className='ok';d.id='o'+i;d.style.top=(900+i*170)+'px';d.innerHTML=`<div class="c">✓</div><div><b>${o[0]}</b><span>${o[1]}</span></div>`;oks.appendChild(d);});
const fmt=m=>{const h=9+Math.floor(m/60),mm=Math.floor(m%60);return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');};
window.render=function(t){
 const B=document.getElementById('before'),A=document.getElementById('after'),E=document.getElementById('end');
 B.style.display=t<6.3?'block':'none';A.style.display=(t>=6.3&&t<11.2)?'block':'none';E.style.display=t>=11.2?'block':'none';
 // before
 const m=Math.min(167, Math.pow(cl((t-0.6)/5.2),1.6)*167);document.getElementById('c1').textContent=fmt(m);
 document.getElementById('c1').style.color=m>120?'#E08A5A':'#EFE7DF';
 document.getElementById('cap1').style.opacity=eo((t-4.6)/0.5);
 W.forEach((w,i)=>{const e=document.getElementById('w'+i),t0=0.8+i*0.62,p=eb((t-t0)/0.45);const [x,y,r]=pos[i];
  const sh=t>4.2?Math.sin(t*60+i)*6*cl((t-4.2)/1.5):0;
  e.style.opacity=t>=t0?1:0;e.style.transform=`translate(${x+sh}px,${y+80*(1-p)}px) rotate(${r}deg) scale(${.85+.15*p})`;});
 // after
 const ta=t-6.3; const m2=Math.min(5,cl(ta/3.2)*5);document.getElementById('c2').textContent=fmt(m2);
 document.getElementById('cap2').style.opacity=eo((ta-3.0)/0.5);
 O.forEach((o,i)=>{const e=document.getElementById('o'+i),p=eo((ta-0.7-i*0.7)/0.45);e.style.opacity=p;e.style.transform=`translateX(${-80*(1-p)}px)`;});
 // end
 const te=t-11.2;[['e0',0],['e1',.1],['e2',.4],['e3',.7],['e4',1.0]].forEach(([id,d])=>{const p=eo((te-d)/.5),e=document.getElementById(id);e.style.opacity=p;e.style.transform=`translateY(${40*(1-p)}px)`;});
 const g=document.getElementById('g');const gp=eb((te-.2)/.8);g.style.transform=`translateY(${200*(1-gp)}px) rotate(${-20*(1-gp)+Math.sin(te*1.4)*3}deg)`;
 // flashes
 const f=document.getElementById('fl');let fo=0;fo=Math.max(fo,1-cl(Math.abs(t-6.3)/0.18));fo=Math.max(fo,0.0);f.style.opacity=fo*0.9;
 f.style.background=t<6.3?'#EFE7DF':'#EFE7DF';
 if(Math.abs(t-11.2)<0.2){f.style.background='#140E08';f.style.opacity=1-cl(Math.abs(t-11.2)/0.2);}
};
render(0);document.title='ready';
</script>
