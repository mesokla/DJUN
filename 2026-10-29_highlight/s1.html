<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat.ttf)}@font-face{font-family:J;src:url(JetBrainsMono.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:M}
.bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 42%,#FFFFFF 0%,#F4EEE7 45%,#EFE7DF 75%,#E6DACD 100%)}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(161,110,59,.5)}
.g{position:absolute;left:0;top:0;width:200px;height:200px;text-align:center;font:800 200px/200px M;transform-origin:center;will-change:transform}
#crest{position:absolute;left:540px;top:720px;height:300px;transform:translate(-50%,-50%)}
#word{position:absolute;left:540px;top:960px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#word img{height:60px}#word small{font:700 26px/1 M;letter-spacing:.3em;color:#A16E3B;margin-top:16px;margin-right:-.3em}
#t1{position:absolute;left:80px;right:80px;top:1230px;text-align:center;font:800 64px/1.1 M;letter-spacing:-.03em;color:#190F09}
#t1 em{font-style:normal;color:#A16E3B}
#t2{position:absolute;left:0;right:0;top:1440px;text-align:center;font:500 34px/1 J;color:#6E5F52}
</style>
<div class="bg"></div>
<div class="ring" id="r1" style="left:-260px;top:1380px;width:760px;height:760px"></div>
<div class="ring" id="r2" style="left:700px;top:-200px;width:600px;height:600px;border-style:dashed;border-width:2px;border-color:rgba(161,110,59,.35)"></div>
<div class="g" id="g0" style="color:#A16E3B">}</div>
<div class="g" id="g1" style="color:#A16E3B">O</div>
<div class="g" id="g2" style="color:#A16E3B">#</div>
<div class="g" id="g3" style="color:#A16E3B">›</div>
<img id="crest" src="crest.svg">
<div id="word"><img src="letters.svg"><small>AI академія</small></div>
<div id="t1">Освіта, яка встигає<br><em>за технологіями</em></div>
<div id="t2">гортайте, розкажемо про нас →</div>
<script>
const cl=(x)=>Math.max(0,Math.min(1,x)), ease=(x)=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, back=(x)=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const start=[[170,420,-18],[860,560,12],[210,1250,10],[880,1380,-14]];
const end=[[493,680],[590,683],[495,786],[593,774]];
window.render=function(t){
  for(let i=0;i<4;i++){const el=document.getElementById('g'+i);
    const pop=back((t-0.1-i*0.15)/0.5), mv=ease((t-1.0-i*0.06)/0.9);
    const [sx,sy,r]=start[i],[ex,ey]=end[i];
    const x=sx+(ex-sx)*mv, y=sy+(ey-sy)*mv, s=pop*(1-0.7*mv), rot=r*(1-mv);
    const fade=1-cl((t-2.0)/0.15);
    el.style.transform=`translate(${x-100}px,${y-100}px) scale(${s}) rotate(${rot}deg)`;el.style.opacity=(pop>0?1:0)*fade;}
  const c=document.getElementById('crest');const cp=back((t-1.95)/0.5);
  c.style.opacity=cl((t-1.95)/0.25);c.style.transform=`translate(-50%,-50%) scale(${0.97+0.03*cp})`;
  const w=document.getElementById('word');const wp=ease((t-2.5)/0.7);
  w.style.clipPath=`inset(0 ${100-100*wp}% 0 0)`;w.style.opacity=wp>0?1:0;
  const a=ease((t-3.3)/0.6);const t1=document.getElementById('t1');t1.style.opacity=a;t1.style.transform=`translateY(${40*(1-a)}px)`;
  const b=ease((t-3.9)/0.6);const t2=document.getElementById('t2');t2.style.opacity=b;t2.style.transform=`translateX(${(-30)*(1-b)+ (t>4.6?Math.sin((t-4.6)*4)*8:0)}px)`;
  document.getElementById('r1').style.transform=`rotate(${t*4}deg) scale(${0.9+0.1*ease(t/2)})`;
  document.getElementById('r2').style.transform=`rotate(${-t*6}deg)`;
};
render(0);
</script>
