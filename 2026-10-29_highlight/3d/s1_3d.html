<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat.ttf)}@font-face{font-family:J;src:url(JetBrainsMono.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:M}
.bg{position:absolute;inset:0;background:radial-gradient(55% 32% at 50% 36%,#4a3620 0%,#2a1d11 45%,#160f09 80%,#0f0a06 100%)}.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(217,180,140,.8) 1.8px,transparent 2.4px);background-size:48px 48px;-webkit-mask:radial-gradient(60% 38% at 50% 38%,#000 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.2) 100%)}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(161,110,59,.45)}
canvas{position:absolute;left:0;top:0}
#word{position:absolute;left:540px;top:1185px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#word img{height:70px}#word small{font:700 28px/1 M;letter-spacing:.32em;color:#D2A26C;margin-top:18px;margin-right:-.32em}
#t1{position:absolute;left:60px;right:60px;top:1360px;text-align:center;font:800 66px/1.08 M;letter-spacing:-.03em;color:#EFE7DF}
#t1 em{font-style:normal;color:#D2A26C}
#t2{position:absolute;left:0;right:0;top:1555px;text-align:center;font:500 34px/1 J;color:#C9B8A6}
</style>
<div class="bg"></div><div class="dots" id="dots"></div>


<div id="word"><img src="letters_light.svg"><small>AI академія</small></div>
<div id="t1">Освіта, яка встигає<br><em>за технологіями</em></div>
<div id="t2">гортайте, розкажемо про нас →</div>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {SVGLoader} from './jsm/loaders/SVGLoader.js';import {RoomEnvironment} from './jsm/environments/RoomEnvironment.js';
const W=1080,H=1920;const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.insertBefore(renderer.domElement,document.getElementById('word'));
const scene=new THREE.Scene();const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(30,W/H,10,20000);const dist=(H/2)/Math.tan(THREE.MathUtils.degToRad(15));cam.position.set(0,0,dist);
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-600,900,1500);scene.add(key);
const rim=new THREE.PointLight(0xffe2bd,1.3,0,0);rim.position.set(500,300,900);scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff,0.25));
const brown=new THREE.MeshPhysicalMaterial({color:0xC99662,metalness:0.6,roughness:0.3,clearcoat:0.6,clearcoatRoughness:0.2,side:THREE.DoubleSide});
const ink=new THREE.MeshPhysicalMaterial({color:0x1b1b1b,metalness:0.25,roughness:0.38,clearcoat:0.5,clearcoatRoughness:0.3,side:THREE.DoubleSide});
const txt=await (await fetch('crest.svg')).text();const data=new SVGLoader().parse(txt);
const CX=646.8,CY=372,S=5.0;
const crest=new THREE.Group();crest.position.set(0,H/2-690,0);scene.add(crest);
function ribbon(pts,w){const L=[],R=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b.x-a.x,dy=b.y-a.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const nx=-dy*w/2,ny=dx*w/2;L.push(new THREE.Vector2(pts[i].x+nx,pts[i].y+ny));R.push(new THREE.Vector2(pts[i].x-nx,pts[i].y-ny));}return new THREE.Shape([...L,...R.reverse()]);}
function piece(shapes,mat,depth,z){const g=new THREE.ExtrudeGeometry(shapes,{depth,bevelEnabled:true,bevelThickness:1.1,bevelSize:0.85,bevelSegments:1,curveSegments:32});
 g.translate(-CX,-CY,0);g.scale(1,-1,1);g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,0);g.computeVertexNormals();
 const m=new THREE.Mesh(g,mat);const holder=new THREE.Group();holder.add(m);holder.userData.home=new THREE.Vector3(c.x*S,c.y*S,z*S);holder.scale.setScalar(S);crest.add(holder);return holder;}
const fillShapes=i=>SVGLoader.createShapes(data.paths[i]);
const pts=(i)=>data.paths[i].subPaths[0].getPoints(24);
const P={};
P.shL=piece(ribbon(pts(176),8),brown,7,0);
P.shR=piece(ribbon(pts(181),8),brown,7,0);
P.bar=piece(ribbon(pts(174),8),brown,7,0);
P.inkTR=piece(fillShapes(175),ink,6,0);
P.inkBL=piece(fillShapes(173),ink,6,0);
P.brace=piece(fillShapes(171),brown,5,6);
const ring=new THREE.Shape();ring.absarc(675.3,349.1,12.1,0,Math.PI*2);const hole=new THREE.Path();hole.absarc(675.3,349.1,7.3,0,Math.PI*2,true);ring.holes.push(hole);
P.O=piece(ring,brown,5,6);
P.chev=piece(fillShapes(179),brown,5,6);
P.hash=piece([182,183,184,185,186].flatMap(fillShapes),brown,5,6);
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// start offsets (pixels), rotation (x,y,z), t0, dur
const A={shL:[[-900,-200,300],[0,1.6,0.6],0.0,1.1],shR:[[900,-200,300],[0,-1.6,-0.6],0.1,1.1],bar:[[0,700,400],[1.8,0,0.3],0.35,1.0],
 inkTR:[[500,500,1200],[1.2,2.2,0.8],0.7,1.1],inkBL:[[-500,-500,1200],[-1.2,-2.2,-0.8],0.85,1.1],
 brace:[[-300,250,1600],[0.25,0.3,-6.28],1.45,0.9],O:[[300,250,1600],[-0.25,0.3,6.28],1.6,0.9],hash:[[-300,-250,1600],[0.25,-0.3,6.28],1.75,0.9],chev:[[300,-250,1600],[-0.25,-0.3,-6.28],1.9,0.9]};
window.render=function(t){
 for(const k in P){const [o,r,t0,d]=A[k];const p=(k.length<=5&&['brace','O','hash','chev'].includes(k))?eb((t-t0)/d):eo((t-t0)/d);const h=P[k].userData.home;const q=1-p;
  const qz=Math.max(0,1-eo((t-t0)/d));P[k].position.set(h.x+o[0]*q,h.y+o[1]*q,h.z+o[2]*qz);P[k].rotation.set(r[0]*q,r[1]*q,r[2]*q);P[k].visible=t>=t0;}
 const s=eo((t-2.9)/1.2);crest.rotation.y=(-0.32+Math.sin(t*0.7)*0.08)*s;crest.rotation.x=(0.12+Math.sin(t*0.5)*0.03)*s;
 rim.position.x=600*Math.cos(t*0.8);rim.position.y=300+200*Math.sin(t*0.8);
 renderer.render(scene,cam);
 const w=eo((t-2.9)/0.8);const we=document.getElementById('word');we.style.clipPath=`inset(0 ${100-100*w}% 0 0)`;we.style.opacity=w>0?1:0;
 const a=eo((t-3.6)/0.7),t1=document.getElementById('t1');t1.style.opacity=a;t1.style.transform=`translateY(${40*(1-a)}px)`;
 const b=eo((t-4.2)/0.6),t2=document.getElementById('t2');t2.style.opacity=b;t2.style.transform=`translateX(${-30*(1-b)+(t>4.9?Math.sin((t-4.9)*4)*8:0)}px)`;
 document.getElementById('dots').style.opacity=0.6+0.4*eo(t/3);
};
await document.fonts.ready;window.render(0);document.title='ready';
</script>
