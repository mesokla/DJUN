<!doctype html><meta charset="utf-8"><style>*{margin:0}body{width:1080px;height:1920px;position:relative;overflow:hidden}

.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(217,180,140,.75) 2px,transparent 2.6px);background-size:52px 52px;-webkit-mask:radial-gradient(34% 19% at 50% 50%,#000 0%,rgba(0,0,0,.4) 70%,transparent 100%)}

<div class="bg"></div><div class="dots"></div><img src="glyph_chev.png" style="height:520px">
